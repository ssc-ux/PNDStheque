name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          M=https://www.maladiesautoinflammatoires.fr/_files/ugd/4723d8_
          full() { echo "@@@@@ $1"; curl -sLA "$UA" -o f.pdf "$2"; pdftotext f.pdf - | tr -s ' \t' ' ' | grep -v '^\s*$' | head -${3:-400}; }
          full CHECKLIST ${M}5b5ea6e3beb442aa8c3f484abb278056.pdf
          full COLCHICINE ${M}c8f723a4bff44a9dbadb3f72b798cee5.pdf
          full RTX_CRI "https://cri-net.com/ckfinder/userfiles/files/fiches-pratiques/rituximab2017/RTX_20%20Info_patient.pdf"
          full MTX22 https://cri-net.com/ckfinder/userfiles/files/fiches-pratiques/MTX-Dec2016/MTX_22.pdf
          full MTX03 https://cri-net.com/ckfinder/userfiles/files/fiches-pratiques/MTX-Dec2016/MTX_03.pdf 200
          sec() { echo "@@@@@ $1"; curl -sLA "$UA" -o p.pdf "$2"; pdftotext p.pdf - | tr -s ' \t' ' ' | grep -v '^\s*$' > p.txt; shift 2; for k in "$@"; do echo "##### $k"; grep -n -i -m 5 -B2 -A10 "$k" p.txt | cut -c1-230; done; }
          sec LUPUS_HCQ https://www.has-sante.fr/upload/docs/application/pdf/2024-02/pnds_ls.pdf 'Tableau 17' 'surveillance ophtalmologique' 'dépistage annuel' 'hydroxychloroquinémie\|dosage sanguin' 'allaitement'
          sec SAPL https://www.has-sante.fr/upload/docs/application/pdf/2022-10/pnds_sapl_vf_3.pdf 'œstrogène\|oestrogène' 'contraception' 'éducation thérapeutique' 'AVK\|antivitamine' 'INR' 'anticoagulants oraux directs\|AOD' 'grossesse' 'ETP'
          sec ACG https://www.has-sante.fr/upload/docs/application/pdf/2024-03/pnds_acg_vf_1.pdf 'éducation thérapeutique' 'signes d.alerte\|consulter en urgence' 'baisse.*vision\|visuel' 'décroissance' 'rechute' 'tocilizumab' 'pseudo-polyarthrite'
