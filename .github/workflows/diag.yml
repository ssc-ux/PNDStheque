name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sLA "$UA" -o l.pdf https://www.has-sante.fr/upload/docs/application/pdf/2024-02/pnds_ls.pdf
          pdftotext l.pdf l.txt; tr -s ' ' < l.txt | grep -v '^\s*$' > t.txt
          for k in 'photoprot' 'tabac' 'hydroxychloroquine.*ophtalm\|ophtalmolog\|rétinopathie' 'vaccin' 'contracepti' 'grossesse' 'éducation thérapeutique' 'vitamine D' 'soleil\|UV'; do
            echo "########## $k"; grep -n -i -m 6 -B2 -A6 "$k" t.txt | cut -c1-220; done
