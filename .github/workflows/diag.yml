name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          pdfs() { echo "=== $1"; curl -sLA "$UA" --max-time 25 "$1" | tr '\n' ' ' | grep -o '<a [^>]*href="[^"]*\.pdf[^"]*"[^>]*>[^<]\{0,120\}' | sed 's/\s\+/ /g; s/<a [^>]*href="\([^"]*\)"[^>]*>/\1 | /' | sort -u | head -40; }
          for u in https://www.maladiesautoinflammatoires.fr/livretspatients https://www.maladiesautoinflammatoires.fr/livrets-patients https://www.maladiesautoinflammatoires.fr/tryptiques-patient \
                   https://pitiesalpetriere.aphp.fr/lupus/la-mediatheque/ https://hpnfrance.com/documentations-patients/ \
                   https://myopathiesinflammatoires.afm-telethon.fr/documentation/ https://www.association-sclerodermie.fr/association/documentation/ \
                   https://sarcoidose-france.fr/documentation/ https://associationiris.org/documentation/nos-outils/ https://www.assocastleman.fr/ \
                   https://www.vml-asso.org/maladie/fabry/ https://www.amsao.fr/ https://www.o-cyto.org/ https://affmf.fr/les-maladies/ \
                   https://www.association-vascularites.org/les-vascularites-c-est-quoi/fiches-individuelles https://maladiesrares-necker.aphp.fr/100-questions-reponses-sur-la-mastocytose/ \
                   https://marih.fr/ressources/ https://www.cereo.fr/ https://amylose.asso.fr/ ; do pdfs "$u"; done
          echo "=== FAI2R questions-patients"
          for s in behcet lupus-systemique sclerodermie-systemique myopathies-inflammatoires/dermatomyosite sarcoidose maladie-de-still-de-ladulte fievre-mediterraneenne-familiale uveites amylose-aa cryopyrinopathies; do
            curl -sLA "$UA" -o /dev/null -w "%{http_code} $s\n" "https://www.fai2r.org/les-pathologies-rares/$s/questions-patients/"; done
