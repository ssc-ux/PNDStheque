name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          curl -sA "$UA" -o r.html "https://www.has-sante.fr/jcms/c_1771214/fr/nos-flux-d-information-rss"
          echo "== feeds"; grep -io '<a[^>]*href="[^"]*"[^>]*>[^<]*' r.html | grep -i 'rss\|xml\|feed\|flux' | sort -u | head -60
          for f in $(grep -o 'href="[^"]*\(rss\|RSS\|feed\|\.xml\)[^"]*"' r.html | sed 's/href="//;s/"$//;s/&amp;/\&/g' | sort -u | head -25); do
            case "$f" in http*) u="$f";; /*) u="https://www.has-sante.fr$f";; *) u="https://www.has-sante.fr/$f";; esac
            echo "=== $u"; curl -sA "$UA" -o f.xml -w "%{http_code} %{content_type}\n" "$u"
            grep -o '<title>[^<]*' f.xml | head -4; echo "PNDS items: $(grep -ic 'pnds\|protocole national' f.xml)"
          done
