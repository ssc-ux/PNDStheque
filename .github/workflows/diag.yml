name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in https://www.rhumatismes.net/ "https://www.rhumatismes.net/index.php?id_bro=21" "http://www.rhumatismes.net/index.php?id_bro=21" "https://rhumatismes.net/index.php?id_bro=21" "https://www.rhumatismes.net/index.php?p=57&id_bro=21&rub=les100q" "https://www.rhumatismes.net/index.php?p=113&id_bro=30&rub=les100q" "https://rhumatismes.net/index.php?p=206&id_bro=31+&rub=les100q"; do
            echo "=== $u"; curl -sSLA "$UA" -o p.html; echo "(http1.1)"; curl --http1.1 -sSLA "$UA" -o p.html -w "%{http_code} %{content_type} %{url_effective}\n" "$u" 2>&1; wc -c < p.html 2>/dev/null; grep -o '<title>[^<]*' p.html 2>/dev/null; sleep 3
          done
