name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for id in c_2867359 c_2666857 p_3921774 p_3431517; do
            echo "=== $id"; curl -sLA "$UA" -o d -w "%{http_code} %{content_type} %{url_effective}\n" "https://www.has-sante.fr/jcms/$id"
            tr '\n' ' ' < d | grep -o 'upload/docs/application/pdf/[^"'"'"' ]*\.pdf' | sort -u | head -5
          done
