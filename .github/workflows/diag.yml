name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          B=https://www.fai2r.org/les-pathologies-rares
          for slug in traps muckle-wells syndrome-de-muckle-wells polychondrite-atrophiante syndrome-de-cogan cogan maladie-associee-aux-igg4 igg4 vascularite-cryoglobulinemique cryoglobulinemie syndrome-de-schnitzler schnitzler deficit-en-mevalonate-kinase deficit-mevalonate-kinase pfapa; do
            for sub in questions-patients generalites; do
              curl -sLA "$UA" -o /dev/null -w "%{http_code} $slug/$sub\n" "$B/$slug/$sub/"
            done
          done | grep '^200'
