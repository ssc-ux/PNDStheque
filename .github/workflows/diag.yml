name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          echo "=== rhumatismes.net"; curl -sLA "$UA" https://www.rhumatismes.net/ | iconv -f latin1 -t utf-8 2>/dev/null | tr '\n' ' ' | grep -o '<a [^>]*href="[^"]*id_bro=[^"]*"[^>]*>[^<]*' | sed 's/\s\+/ /g' | sort -u | head -40
          for b in 21 30 31; do echo "--- id_bro=$b"; curl -sLA "$UA" "https://www.rhumatismes.net/index.php?id_bro=$b" | tr '\n' ' ' | grep -io 'href="[^"]*\.pdf"\|<title>[^<]*' | sort -u | head -5; done
          echo "=== fai2r questions-patients"
          curl -sLA "$UA" https://www.fai2r.org/sitemap_index.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > idx.txt; cat idx.txt
          for s in $(cat idx.txt); do curl -sLA "$UA" "$s" | grep -o '<loc>[^<]*' | sed 's/<loc>//'; done | grep -i 'questions-patients\|100-questions\|livret\|brochure' | sort -u | head -80
          echo "=== fai2r pdf uploads patients"
          for s in $(cat idx.txt); do curl -sLA "$UA" "$s" | grep -o '<loc>[^<]*\.pdf' | sed 's/<loc>//'; done | grep -i '100q\|livret\|patient\|brochure' | sort -u | head -40
