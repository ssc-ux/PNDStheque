name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for id in 0b900c6cd39f4b3390a20360151126e2 2313f8c2a1154357b150cbdf849beda6 69243de8822d4223b31e65482dd9eed7 bec5107d295e4a6781351bd84adca216; do
            curl -sLA "$UA" -o f.pdf "https://www.maladiesautoinflammatoires.fr/_files/ugd/4723d8_$id.pdf"
            echo "=== $id"; pdftotext f.pdf - | tr -s ' \n' ' ' | grep -io "qu.est.ce que[^?]*?\|la maladie de [A-Za-zéè-]*\|syndrome [A-Za-zéè-]*\|fièvre [A-Za-zéè]*\|goutte\|Behçet\|Still\|pseudo-goutte\|chondrocalcinose" | sort | uniq -c | sort -rn | head -6
          done
