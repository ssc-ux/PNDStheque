name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          echo "=== katana CP"; curl -sLA "$UA" -o cp.pdf -w "%{http_code} %{content_type}\n" https://www.katanasante.com/wp-content/uploads/2024/03/CP_Vascularites_100Q.pdf
          pdfinfo cp.pdf | grep -i 'pages\|title'; pdftotext -l 2 cp.pdf - | head -40
          echo "=== fai2r media search"
          for q in vascularite VNS 100Q; do curl -sLA "$UA" "https://www.fai2r.org/wp-json/wp/v2/media?search=$q&per_page=50" | grep -o '"source_url":"[^"]*\.pdf"' | sed 's/\\//g'; done | sort -u
          echo "=== france vascularites"
          for u in https://www.association-vascularites.org/ https://www.association-vascularites.org/2-non-categorise/160-documentation-a-telecharger; do curl -sLA "$UA" "$u" | tr '\n' ' ' | grep -io '<a [^>]*href="[^"]*"[^>]*>[^<]*100 questions[^<]*\|href="[^"]*100[^"]*\.pdf"'; done | head
          echo "=== katana pages"
          for u in https://www.katanasante.com/nos-evenements/les-vascularites-en-100-questions/ https://www.editionskatanasante.com/portfolio/les-vascularites-necrosantes-systemiques/; do curl -sLA "$UA" "$u" | tr '\n' ' ' | grep -o 'href="[^"]*\.pdf"\|href="[^"]*\(calameo\|issuu\|flipbook\|feuilleter\|lire\)[^"]*"' | sort -u; done
