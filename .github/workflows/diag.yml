name: diag (temporaire)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          M=https://www.maladiesautoinflammatoires.fr
          urls=$( (curl -sLA "$UA" $M/livretspatients; curl -sLA "$UA" $M/tryptiques-patient) | grep -o "$M/_files/ugd/[a-z0-9_]*\.pdf" | sort -u)
          V=https://www.association-vascularites.org/images/fiches_individuelles_vascularites
          urls="$urls $V/GPA_A5.pdf $V/GEPA_A5.pdf $V/PAM_A5.pdf $V/fiche_PAN.pdf $V/fiche_Taka_23_02_2021.pdf $V/ACG_diagnostic.pdf $V/Corticoïdes_A5.pdf $V/Ritux_A5.pdf
            https://www.orpha.net/data/patho/Pub/fr/Antiphospholipides-FRfrPub5517.pdf https://www.orpha.net/data/patho/Pub/fr/LupusErythemateuxSystemique-FRfrPub124.pdf
            https://sfh.hematologie.net/sites/sfh.hematologie.net/files/medias/documents/aplasiemedullaire.pdf https://sfh.hematologie.net/sites/sfh.hematologie.net/files/medias/documents/hpn.pdf https://sfh.hematologie.net/sites/sfh.hematologie.net/files/medias/documents/anemie_hemolytique_autoimmune.pdf
            https://hpnfrance.com/wp-content/uploads/2023/01/Livretd-informationdestineauxpatientsAMmajoctobre2022.pdf https://affmf.fr/wp-content/uploads/2024/05/Livret-FMF-Version-Finale-2.pdf
            https://www.assocastleman.fr/wp-content/uploads/2024/11/Carnet-de-suivi-patient-Castleman-191124.pdf https://europeanlung.org/wp-content/uploads/2022/05/Sarcoidosis-lay-guidelines_FR.pdf
            https://associationiris.org/wp-content/uploads/2022/01/DEPLIANT_IRIS_3voletsA5_BAT_DIGITAL.pdf https://sante.gouv.fr/IMG/pdf/angioconseils.pdf
            https://www.myobase.org/doc_num.php?explnum_id=15920 https://www.polyarthrite.org/wp-content/uploads/2023/09/Le-syndrome-de-Sjogren.pdf
            https://documentation.afpentraide.org/wp-content/uploads/2021/03/Pseudo_Polyarthrite_rhyzome%CC%81lique.pdf"
          for u in $urls; do
            code=$(curl -sLA "$UA" --max-time 40 -o f.pdf -w "%{http_code}|%{content_type}" "$u")
            t=$(pdfinfo f.pdf 2>/dev/null | sed -n 's/^Title: *//p;s/^Pages: *//p;s/^CreationDate: *//p' | tr '\n' '|')
            first=$(pdftotext -l 2 f.pdf - 2>/dev/null | tr -s ' \n' ' ' | cut -c1-200)
            echo "$code | $t | $first | $u"
          done
          echo "=== necker mastocytose"; curl -sLA "$UA" -o /dev/null -w "%{http_code}\n" https://maladiesrares-necker.aphp.fr/100-questions-reponses-sur-la-mastocytose/
          echo "=== sarcoidose-france"; curl -sLA "$UA" https://sarcoidose-france.fr/documentation/ | tr '\n' ' ' | grep -o 'href="[^"]*"[^>]*>[^<]\{3,80\}' | grep -iv 'facebook\|linkedin\|instagram' | head -30
